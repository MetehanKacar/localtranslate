name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve? / Hangi sorunu çözer?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour / Önerilen davranış
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / Alternatifler
